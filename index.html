<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ZEISS Vision Center Guarujá</title>
<meta name="description" content="Fale com a Ótica ZEISS Vision Center Guarujá pelo WhatsApp, Instagram ou Google.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans:wght@300;400;600;700&display=swap" rel="stylesheet">
<style>
:root{
  /* azul ZEISS (amostrado do logo) */
  --blue:#0f2db3; --blue-dark:#0a1f80; --blue-soft:#e9eefb; --blue-line:#cdd7f3;
  --ink:#141a2e; --muted:#5b6582; --bg:#ffffff; --bg-2:#f5f7fc;
  /* tipografia: ZEISS Typeface quando instalada; senão as fontes de sistema que a própria ZEISS indica para telas */
  --font:"ZEISS Text","ZEISS Head",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",system-ui,sans-serif;
  --font-head:"ZEISS Head","ZEISS Text",-apple-system,BlinkMacSystemFont,"Segoe UI","Noto Sans",system-ui,sans-serif;
  color-scheme:light;
}
*{box-sizing:border-box}
body{margin:0;min-height:100%;background:var(--bg);
  color:var(--ink);font-family:var(--font);-webkit-tap-highlight-color:transparent}
.wrap{max-width:440px;margin:0 auto;padding:44px 16px 40px;display:flex;flex-direction:column;align-items:center}
.logo{width:112px;height:auto;display:block}
.brand{margin:24px 0 0;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-family:var(--font-head)}
.brand .l1{font-size:13px;font-weight:600;letter-spacing:.38em;text-transform:uppercase;color:var(--muted);padding-left:.38em}
.brand h1{margin:0;font-size:21px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--ink);line-height:1.25;text-wrap:balance}
.brand h1 .t{color:var(--blue);font-weight:400;margin:0 .35em}
.brand .l3{font-size:12px;font-weight:600;letter-spacing:.3em;text-transform:uppercase;color:var(--blue);padding-left:.3em}
.group{width:100%;display:flex;flex-direction:column;gap:10px}
.lk .tx b{font-size:15px}
.lk.soon{cursor:default;border-style:dashed;background:var(--bg-2);box-shadow:none;color:var(--muted)}
.lk.soon .ic{background:#eef0f5;color:#8a93ad}
.lk.soon:hover{border-color:var(--blue-line);box-shadow:none}
.badge{margin-left:auto;flex:none;font-size:9px;font-weight:700;letter-spacing:.1em;text-transform:uppercase;color:var(--blue);background:var(--blue-soft);border-radius:20px;padding:4px 7px}
.links{width:100%;display:flex;flex-direction:column;gap:22px;margin-top:30px}
.lk{display:flex;align-items:center;gap:14px;min-height:66px;padding:12px 16px;border-radius:12px;text-decoration:none;color:var(--ink);
  background:var(--bg);border:1px solid var(--blue-line);box-shadow:0 1px 2px rgba(15,45,179,.06);
  transition:transform .15s ease,border-color .2s ease,box-shadow .2s ease}
.lk:hover,.lk:focus-visible{border-color:var(--blue);box-shadow:0 6px 18px rgba(15,45,179,.12);outline:none}
.lk:active{transform:scale(.98)}
.ic{width:42px;height:42px;border-radius:10px;display:grid;place-items:center;flex:none;background:var(--blue-soft);color:var(--blue)}
.ic svg{width:22px;height:22px}
.tx{display:flex;flex-direction:column;gap:2px;min-width:0}
.tx b{font-weight:600;font-size:15px}
.tx small{font-size:13px;color:var(--muted);overflow-wrap:anywhere}
.arr{margin-left:auto;color:var(--blue);flex:none;width:18px;height:18px}
.lk.main{background:var(--blue);border-color:var(--blue);color:#fff;box-shadow:0 10px 24px rgba(15,45,179,.28)}
.lk.main:hover,.lk.main:focus-visible{background:var(--blue-dark)}
.lk.main .ic{background:rgba(255,255,255,.16);color:#fff}
.lk.main .tx small{color:rgba(255,255,255,.8)}
.lk.main .arr{color:#fff}
footer{margin-top:36px;text-align:center;font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--muted)}
footer .rule{width:48px;height:2px;background:var(--blue);margin:0 auto 14px;border-radius:2px}
</style>
</head>
